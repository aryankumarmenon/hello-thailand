name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # ADR 0003: the denylist is private, so CI reads it from a secret. A missing
      # secret fails the job rather than passing a check that never ran.
      - run: pnpm privacy-lint
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
